name: Diagnose auth

# Manually triggered: reproduces the sign-in form's OTP request against the
# hosted project and prints the exact status + error body. Uses only the
# publishable (anon) key. If the request succeeds it sends a real magic-link
# email to the address given.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email to request a magic link for
        default: alton@texasgreenerpastures.com
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://pdrvinfahqnskuwqumuu.supabase.co
      ANON_KEY: sb_publishable_qYvdo406rkxrs1i89h3LwA_PO4wS8ZG
    steps:
      - name: Public auth settings
        run: |
          curl -sS "$SUPABASE_URL/auth/v1/settings" -H "apikey: $ANON_KEY" | head -c 2000; echo

      - name: Request magic link (same call the sign-in form makes)
        run: |
          curl -sS -o body.json -w "HTTP %{http_code}\n" -D headers.txt \
            -X POST "$SUPABASE_URL/auth/v1/otp" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\": \"${{ inputs.email }}\", \"create_user\": true}"
          echo "--- response body:"; cat body.json; echo
          echo "--- retry hints:"; grep -i "retry\|rate" headers.txt || true
