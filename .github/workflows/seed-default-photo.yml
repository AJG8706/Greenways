name: Seed default corner photos

# Uploads the example-pin stand-ins from public/media into the
# property-photos bucket (defaults/corner-pin-default.jpg for the stake
# slot, defaults/corner-approach-default.jpg for the approach slot) and
# points every corner's empty-or-default slots at them. Manual trigger,
# idempotent (x-upsert + no-op-safe UPDATEs). Any real photo paths being
# replaced are printed first so the overwrite is recoverable from the run
# log (the photo files themselves are never deleted from storage).

on:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pdrvinfahqnskuwqumuu
      STAKE_PATH: defaults/corner-pin-default.jpg
      APPROACH_PATH: defaults/corner-approach-default.jpg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload the images to storage
        run: |
          set -euo pipefail
          # Service-role key fetched at run time, held in a shell var only.
          # It is NOT a masked secret, so nothing below may print it.
          KEY=$(curl -sf "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          test -n "$KEY" && test "$KEY" != "null"
          put() {
            curl -sf -X POST \
              "https://$PROJECT_REF.supabase.co/storage/v1/object/property-photos/$1" \
              -H "Authorization: Bearer $KEY" \
              -H "apikey: $KEY" \
              -H "Content-Type: image/jpeg" \
              -H "x-upsert: true" \
              --data-binary "@$2" | jq .
          }
          put "$STAKE_PATH" public/media/corner-pin-default.jpg
          put "$APPROACH_PATH" public/media/corner-approach-default.jpg

      - name: Point every corner's photo slots at them
        run: |
          set -euo pipefail
          q() {
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$1" '{query: $q}')"
          }
          echo "Photo paths being replaced (recovery record):"
          q "select p.slug, c.n, c.stake_photo, c.approach_photo
             from public.corners c
             join public.properties p on p.id = c.property_id
             where (c.stake_photo is not null and c.stake_photo <> '$STAKE_PATH')
                or (c.approach_photo is not null and c.approach_photo <> '$APPROACH_PATH')
             order by p.slug, c.n" | jq .
          echo "Updating:"
          q "with u as (update public.corners
               set stake_photo = '$STAKE_PATH', approach_photo = '$APPROACH_PATH'
             where stake_photo is distinct from '$STAKE_PATH'
                or approach_photo is distinct from '$APPROACH_PATH'
             returning 1)
             select count(*) as updated from u" | jq .
          echo "Verify:"
          q "select count(*) as corners_total,
                    count(*) filter (where stake_photo = '$STAKE_PATH') as stake_defaulted,
                    count(*) filter (where approach_photo = '$APPROACH_PATH') as approach_defaulted
             from public.corners" | jq .
          q "select name, (metadata->>'size')::bigint as bytes
             from storage.objects
             where bucket_id = 'property-photos'
               and name in ('$STAKE_PATH', '$APPROACH_PATH')
             order by name" | jq -e 'length == 2'
