name: DB push

# Applies supabase/migrations to the hosted project. Manual trigger.
# Requires two repository secrets (GitHub → Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token (dashboard → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: pdrvinfahqnskuwqumuu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets first."
            exit 1
          fi
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Push migrations
        run: supabase db push --include-all
