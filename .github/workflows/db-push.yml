name: DB push

# Applies supabase/migrations to the hosted project. Manual trigger.
# Requires two repository secrets (GitHub → Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token (dashboard → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: pdrvinfahqnskuwqumuu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving 'latest' hits the GitHub API unauthenticated and
          # rate-limits on shared runners (killed a CI run before tests began).
          version: 2.117.0
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets first."
            exit 1
          fi
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Repair migration history
        # 20260915000001_init.sql was applied via the SQL Editor before the
        # CLI was linked, so the remote schema exists without history. Mark it
        # applied so push starts from the next migration. Idempotent.
        run: supabase migration repair --status applied 20260915000001
      - name: Push migrations
        run: supabase db push --include-all
      - name: Verify new columns are live
        run: |
          BODY=$(curl -fsS "https://$PROJECT_REF.supabase.co/rest/v1/properties?select=sale_status&limit=1" \
            -H "apikey: sb_publishable_qYvdo406rkxrs1i89h3LwA_PO4wS8ZG" \
            -H "Authorization: Bearer sb_publishable_qYvdo406rkxrs1i89h3LwA_PO4wS8ZG")
          echo "sale_status select: $BODY"
