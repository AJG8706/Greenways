name: Diagnose data integrity

# Manually triggered, read-only health report for the hosted database after
# manual edits (e.g. deletes in the SQL editor). Uses the Management API's
# query endpoint with the same access token db-push uses. Prints:
#   1. the property inventory (masters, lots, standalone),
#   2. proof that no child rows dangle (FKs cascade, this shows zeros),
#   3. audit rows pointing at deleted properties (kept on purpose),
#   4. storage files whose property no longer exists (the one thing manual
#      deletes can orphan), with sizes,
#   5. leftover lot-named properties with no master.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pdrvinfahqnskuwqumuu
    steps:
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is missing."
            exit 1
          fi
      - name: Run checks
        run: |
          q() {
            echo ""
            echo "===== $1 ====="
            curl -sf "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$2" '{query: $q}')" | jq .
          }

          q "Property inventory" "
            select slug, name->>'en' as name,
                   case when parent_id is not null then 'lot'
                        when exists (select 1 from properties c where c.parent_id = p.id) then 'master'
                        else 'standalone' end as kind,
                   status, sale_status, created_at::date as created
            from properties p order by created_at"

          q "Dangling child rows (all must be 0 - FKs cascade)" "
            select 'corners' as tbl, count(*) from corners where property_id not in (select id from properties)
            union all select 'media_assets', count(*) from media_assets where property_id not in (select id from properties)
            union all select 'walk_links', count(*) from walk_links where property_id not in (select id from properties)
            union all select 'generation_jobs', count(*) from generation_jobs where property_id not in (select id from properties)
            union all select 'demo_scenarios', count(*) from demo_scenarios where property_id not in (select id from properties)
            union all select 'walk_events', count(*) from walk_events where property_id is not null and property_id not in (select id from properties)"

          q "Audit rows for deleted properties (kept on purpose, renders safely)" "
            select count(*) as audit_rows_for_deleted_properties
            from audit_log where property_id is not null and property_id not in (select id from properties)"

          q "Orphaned storage files (property gone, file left behind)" "
            select name, coalesce((metadata->>'size')::bigint, 0) as bytes
            from storage.objects
            where bucket_id = 'property-photos'
              and split_part(name, '/', 1) not in (select id::text from properties)
            order by name"

          q "Lot-named properties with no master (leftovers from orphaning)" "
            select slug, name->>'en' as name, created_at
            from properties
            where parent_id is null and name->>'en' like '%— Lot%'"
