name: Diagnose walk

# Manually triggered probe of the deployed buyer walk. The events endpoint
# uses the same service-role read path as the walk page, so its error body
# tells apart: missing row / service-key failure ("unknown walk") vs data
# present (returns a sessionId) vs write failure.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      URL: https://greenways-jade.vercel.app
      SUPABASE_URL: https://pdrvinfahqnskuwqumuu.supabase.co
      ANON_KEY: sb_publishable_qYvdo406rkxrs1i89h3LwA_PO4wS8ZG
    steps:
      - name: Walk page status + body head
        run: |
          curl -s -o page.html -w "HTTP %{http_code}\n" "$URL/walk/broussard-lot-4?demo=clean"
          head -c 600 page.html; echo

      - name: Events ingest (same service-role read path as the page)
        run: |
          curl -s -o body.json -w "HTTP %{http_code}\n" -X POST "$URL/api/walk-events" \
            -H "Content-Type: application/json" \
            -d '{"slug":"broussard-lot-4","locale":"en","device":"diagnose","events":[{"name":"walk_opened","ts":0}]}'
          cat body.json; echo

      - name: Anon REST sanity (RLS should return [])
        run: |
          curl -s -w "\nHTTP %{http_code}\n" "$SUPABASE_URL/rest/v1/properties?select=slug&slug=eq.broussard-lot-4" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY"

      - name: Inspect walk data directly (pooler)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "postgresql://postgres.pdrvinfahqnskuwqumuu@aws-0-us-east-1.pooler.supabase.com:5432/postgres" \
            -c "select slug, entrance_lat, entrance_lng, sale_status, status from public.properties where slug='broussard-lot-4';" \
            -c "select n, locked, round(lat::numeric,5) lat, round(lng::numeric,5) lng from public.corners c join public.properties p on p.id=c.property_id where p.slug='broussard-lot-4' order by n;" \
            -c "select count(*) as corner_rows from public.corners;"
