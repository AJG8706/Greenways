name: Diagnose walk

# Manually triggered probe of the deployed buyer walk for any property slug.
# The events endpoint uses the same service-role read path as the walk page,
# so its error body tells apart: missing row / service-key failure ("unknown
# walk") vs data present (returns a sessionId) vs write failure.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Property slug to probe
        type: string
        default: broussard-lot-4
      relock_corners:
        description: Re-lock this property's corners (guardrail #2 lock)
        type: boolean
        default: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      URL: https://greenways-jade.vercel.app
      SUPABASE_URL: https://pdrvinfahqnskuwqumuu.supabase.co
      ANON_KEY: sb_publishable_qYvdo406rkxrs1i89h3LwA_PO4wS8ZG
      SLUG: ${{ inputs.slug }}
    steps:
      - name: Walk page status + body head
        run: |
          curl -s -o page.html -w "HTTP %{http_code}\n" "$URL/walk/$SLUG"
          head -c 600 page.html; echo

      - name: Events ingest (same service-role read path as the page)
        run: |
          curl -s -o body.json -w "HTTP %{http_code}\n" -X POST "$URL/api/walk-events" \
            -H "Content-Type: application/json" \
            -d "{\"slug\":\"$SLUG\",\"locale\":\"en\",\"device\":\"diagnose\",\"events\":[{\"name\":\"walk_opened\",\"ts\":0}]}"
          cat body.json; echo

      - name: Anon REST sanity (RLS should return [])
        run: |
          curl -s -w "\nHTTP %{http_code}\n" "$SUPABASE_URL/rest/v1/properties?select=slug&slug=eq.$SLUG" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY"

      - name: Re-lock corners
        if: inputs.relock_corners
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "postgresql://postgres.pdrvinfahqnskuwqumuu@aws-0-us-east-1.pooler.supabase.com:5432/postgres" <<SQL
          update public.corners c set locked = true
            from public.properties p
           where p.id = c.property_id and p.slug = '$SLUG' and not c.locked;
          SQL

      - name: Inspect walk data directly (pooler)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "postgresql://postgres.pdrvinfahqnskuwqumuu@aws-0-us-east-1.pooler.supabase.com:5432/postgres" <<SQL
          select slug, entrance_lat, entrance_lng, demo_mode, test_lot, status
            from public.properties where slug = '$SLUG';
          select n, locked, round(lat::numeric,5) lat, round(lng::numeric,5) lng, c.updated_at
            from public.corners c join public.properties p on p.id = c.property_id
           where p.slug = '$SLUG' order by n;
          SQL
