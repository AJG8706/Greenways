name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Build · E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving 'latest' hits the GitHub API unauthenticated and
          # rate-limits on shared runners (killed a CI run before tests began).
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - name: Log in to ghcr.io
        # Anonymous pulls share the runner IP's rate limit and get throttled
        # (toomanyrequests killed supabase start twice on one commit);
        # authenticated pulls use a per-identity bucket.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start local Supabase (migrations + seed)
        # setup-cli pins image pulls to ghcr.io, which throttled runners for
        # 45+ minutes straight (Sep 23) — pull from Supabase's AWS public ECR
        # mirror instead. The CLI also retries a throttled pull instantly,
        # which lands in the same throttle window — so back off for real
        # between attempts.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector,edge-runtime && exit 0
            echo "supabase start failed (attempt $i); backing off"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((i * 30))
          done
          exit 1
      - name: Export Supabase env
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "N8N_WEBHOOK_SECRET=e2e-webhook-secret"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Lighthouse budget — buyer walk on emulated mid-range Android
        # Perf + a11y gate (plan §Phase 6; Lighthouse v12 dropped its PWA
        # category, so offline is covered by the Playwright suite instead).
        # Simulated throttling keeps scores stable on shared runners.
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/walk/broussard-lot-4 >/dev/null && break
            sleep 2
          done
          # Three runs: TBT is hostage to runner CPU contention (measured
          # 710ms vs 3410ms on identical code), so the perf floor gates the
          # BEST of three — a real regression sinks all three, one noisy
          # neighbor can't fail the build. Budgets/a11y are stable per-run.
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://localhost:3000/walk/broussard-lot-4 \
              --budget-path=lighthouse-budget.json \
              --output=json --output-path=./lighthouse-walk-$i.json \
              --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices \
              --form-factor=mobile --throttling-method=simulate --quiet
          done
          node -e "
            const reports = [1, 2, 3].map(i => require('./lighthouse-walk-' + i + '.json'));
            const scores = reports.map(x => x.categories.performance.score);
            const perf = Math.max(...scores);
            const r = reports[scores.indexOf(perf)];
            const a11y = r.categories.accessibility.score;
            console.log('performance runs', scores.join(' / '), '→ best', perf, '· accessibility', a11y);
            for (const k of ['server-response-time','first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','interactive','cumulative-layout-shift']) {
              const a = r.audits[k];
              if (a) console.log(k.padEnd(28), a.displayValue ?? a.numericValue, '(score', a.score + ')');
            }
            const lcpEl = r.audits['largest-contentful-paint-element']?.details?.items?.[0]?.items?.[0]?.node?.selector;
            if (lcpEl) console.log('LCP element:', lcpEl);
            for (const it of (r.audits['bootup-time']?.details?.items ?? []).slice(0, 5))
              console.log('bootup', Math.round(it.total) + 'ms', it.url.split('/').pop());
            for (const it of (r.audits['unused-javascript']?.details?.items ?? []).slice(0, 5))
              console.log('unused-js', Math.round(it.wastedBytes / 1024) + 'KB of', Math.round(it.totalBytes / 1024) + 'KB', it.url.split('/').pop());
            const over = [
              ...(r.audits['performance-budget']?.details?.items ?? []).filter(i => i.sizeOverBudget || i.countOverBudget),
              ...(r.audits['timing-budget']?.details?.items ?? []).filter(i => i.overBudget),
            ];
            if (over.length) { console.error('over budget:', JSON.stringify(over, null, 2)); process.exit(1); }
            // Regression floor on the BEST of three runs. Measured best:
            // 0.62 before the walk code-split, 0.79 after (TTI 6.7s → 4.3s).
            // Raise the floor in the PR that earns it, never lower it. Next
            // target: 0.80+ via the shared vendor chunk (bootup/unused-js
            // lines above point at it).
            if (perf < 0.70) { console.error('best-of-3 performance below the 0.70 floor'); process.exit(1); }
            if (a11y < 0.95) { console.error('accessibility score below 0.95'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-walk-*.json
          retention-days: 7
          if-no-files-found: ignore
