name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Build · E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving 'latest' hits the GitHub API unauthenticated and
          # rate-limits on shared runners (killed a CI run before tests began).
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - name: Log in to ghcr.io
        # Anonymous pulls share the runner IP's rate limit and get throttled
        # (toomanyrequests killed supabase start twice on one commit);
        # authenticated pulls use a per-identity bucket.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start local Supabase (migrations + seed)
        # The CLI retries a throttled pull instantly, which lands in the same
        # throttle window — so back off for real between attempts.
        run: |
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector,edge-runtime && exit 0
            echo "supabase start failed (attempt $i); backing off"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((i * 30))
          done
          exit 1
      - name: Export Supabase env
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "N8N_WEBHOOK_SECRET=e2e-webhook-secret"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
