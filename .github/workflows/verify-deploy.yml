name: Verify deployment

# Manually triggered smoke check of the deployed preview + hosted Supabase.
# Uses only the public URL and the publishable (anon) key — no secrets.

on:
  workflow_dispatch:
    inputs:
      deploy_url:
        description: Deployed app origin
        default: https://greenways-jade.vercel.app
        required: true

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.deploy_url }}
      SUPABASE_URL: https://pdrvinfahqnskuwqumuu.supabase.co
      ANON_KEY: sb_publishable_qYvdo406rkxrs1i89h3LwA_PO4wS8ZG
    steps:
      - name: App — root redirects into admin sign-in
        run: |
          # A fresh push may still be building on Vercel; poll up to ~4 min.
          for i in $(seq 1 16); do
            if curl -fsSL -o page.html "$URL/" && grep -q "Sign in to Greenways" page.html; then
              echo "up after $i checks"; exit 0
            fi
            sleep 15
          done
          echo "deployment never became ready"; exit 1

      - name: App — walk surface renders from messages (EN)
        run: |
          curl -fsSL -o walk.html "$URL/walk/broussard-lot-4"
          grep -q "Walk the land" walk.html

      - name: App — walk surface honors the Spanish cookie
        run: |
          curl -fsSL -H "Cookie: NEXT_LOCALE=es" -o walk-es.html "$URL/walk/broussard-lot-4"
          grep -q "Camine el terreno" walk-es.html

      - name: Supabase — schema exists and RLS hides data from anon
        run: |
          # Table present -> 200 with [] (anon is not a team member).
          # Missing schema would return a PostgREST error instead.
          BODY=$(curl -fsS "$SUPABASE_URL/rest/v1/properties?select=slug" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY")
          test "$BODY" = "[]"

      - name: Supabase — is_invited is NOT anon-callable (audit v2 regression check)
        run: |
          # The RPC used to be the team-email oracle; audit v2 revoked anon
          # EXECUTE. Anything other than a permission error here is a
          # security regression, so the old true/false assertions inverted.
          CODE=$(curl -sS -o body.json -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/is_invited" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"check_email": "stranger@example.com"}')
          echo "HTTP $CODE"; cat body.json; echo
          test "$CODE" != "200"
